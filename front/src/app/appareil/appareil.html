<li class="list-group-item border-0 px-0">
  <div class="card">
    <div class="card-body">
      <h5
        class="card-title"
        [class.text-success]="appareil().status === 'On'"
        [class.text-danger]="appareil().status === 'Off'"
      >
        {{ appareil().name }} - {{ appareil().status }}
      </h5>
      @if (appareil().status === 'Off') {
        <button class="btn btn-success btn-sm" (click)="switched.emit(appareil())">Switch on</button>
      } @else {
        <button class="btn btn-danger btn-sm" (click)="switched.emit(appareil())">Switch off</button>
      }
      <a class="btn btn-outline-primary btn-sm ms-2" [routerLink]="['/appareils', appareil()._id]">Detail</a>
      <button class="btn btn-outline-danger btn-sm ms-2" (click)="removed.emit(appareil())">Delete</button>
    </div>
  </div>
</li>
