<li class="list-group-item border-0 px-0">
  <div class="card">
    <div class="card-body">
      <h5
        class="card-title"
        [class.text-success]="appareilStatus() === 'On'"
        [class.text-danger]="appareilStatus() === 'Off'"
      >
        {{ appareilName() }} - {{ appareilStatus() }}
      </h5>
      <input type="text" class="form-control mb-2" [(ngModel)]="appareilName" />
      @if (appareilStatus() === 'Off') {
        <button class="btn btn-success btn-sm" (click)="onSwitch()">Switch on</button>
      } @else {
        <button class="btn btn-danger btn-sm" (click)="onSwitch()">Switch off</button>
      }
      <a class="btn btn-outline-primary btn-sm ms-2"
         [routerLink]="['/appareils', appareilId()]">Detail</a>
    </div>
  </div>
</li>
