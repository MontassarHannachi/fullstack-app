@if (appareil(); as a) {
  <div class="card">
    <div class="card-body">
      <h3 class="card-title">{{ a.name }}</h3>
      <p
        class="card-text"
        [class.text-success]="a.status === 'On'"
        [class.text-danger]="a.status === 'Off'"
      >
        Status: {{ a.status }}
      </p>

      <button
        class="btn btn-success me-2"
        [disabled]="a.status === 'On'"
        (click)="onSwitchOn()"
      >
        Switch On
      </button>
      <button
        class="btn btn-danger me-2"
        [disabled]="a.status === 'Off'"
        (click)="onSwitchOff()"
      >
        Switch Off
      </button>
      <a class="btn btn-warning" routerLink="/appareils">Back</a>
    </div>
  </div>
} @else {
  <div class="alert alert-warning">Appliance not found</div>
  <a class="btn btn-warning" routerLink="/appareils">Back</a>
}
