<h2>Appliances</h2>

<button class="btn btn-success mb-3 me-2" [disabled]="!allowed()" (click)="onSwitchOnAll()">
  Switch on all
</button>
<button class="btn btn-danger mb-3" [disabled]="!allowed()" (click)="onSwitchOffAll()">
  Switch off all
</button>

@if (loading()) {
  <p>Chargement…</p>
} @else if (appareilList().length === 0) {
  <p class="text-muted">Aucun appareil.</p>
} @else {
  <ul class="list-group">
    @for (a of appareilList(); track a._id) {
      <app-appareil
        [appareilId]="a._id"
        [appareilName]="a.name"
        [appareilStatus]="a.status"
        (changed)="load()"
      />
    }
  </ul>
}
