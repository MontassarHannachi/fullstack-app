
<h2 class="mb-4">Appareils électroménagers</h2>

<div class="appareil-grid">  <button
    class="btn btn-success me-2"
    [disabled]="!allowed()"
    (click)="onSwitchOnAll()">
    Allumer tous
  </button>

  <button
    class="btn btn-danger"
    [disabled]="!allowed()"
    (click)="onSwitchOffAll()">
    Éteindre tous
  </button>
</div>

@if (loading()) {
  <p>Chargement des appareils...</p>
} @else if (appareilList().length === 0) {
  <p class="text-muted">Aucun appareil.</p>
} @else {
  <div class="appareil-grid">
    @for (a of appareilList(); track a._id) {
      <app-appareil
        [appareilId]="a._id"
        [appareilName]="a.name"
        [appareilStatus]="a.status"
        (changed)="load()"
      />
    }
  </div>
}
